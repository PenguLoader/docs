on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      deployments: write

    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'production' || 'development' }}
      url: ${{ github.ref == 'refs/heads/main' && 'https://pengu.lol' || 'https://pengu.dev' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Resolve Pages project
        env:
          PROJECT_PROD: ${{ secrets.CLOUDFLARE_PROJECT_PROD }}
          PROJECT_DEV: ${{ secrets.CLOUDFLARE_PROJECT_DEV }}
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            PROJECT="$PROJECT_PROD"
          else
            PROJECT="$PROJECT_DEV"
          fi
          if [[ -z "$PROJECT" ]]; then
            echo "::error::No Pages project configured for ${{ github.ref_name }} -- set the CLOUDFLARE_PROJECT_PROD / CLOUDFLARE_PROJECT_DEV secrets."
            exit 1
          fi
          echo "CF_PAGES_PROJECT=$PROJECT" >> $GITHUB_ENV

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: pnpm

      - name: Build project
        run: |
          pnpm install
          pnpm build

      # One Pages project per environment, each owning its own domain:
      #   main -> CLOUDFLARE_PROJECT_PROD -> pengu.lol
      #   dev  -> CLOUDFLARE_PROJECT_DEV  -> pengu.dev
      # --branch must match each project's own production branch so the upload
      # lands as a production deployment rather than a preview.
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy .vitepress/dist
            --project-name=${{ env.CF_PAGES_PROJECT }}
            --branch=${{ github.ref_name }}
